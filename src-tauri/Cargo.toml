[package]
name = "vpm-search"
version = "0.1.0"
description = "vpm-search"
authors = ["asonnychen"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vpm_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
